# No api_key here: aichat falls back to OPENROUTER_API_KEY, which bash_secrets carries.
# Only ':free' ids are listed, since a client's own list replaces the built-in one.

model: openrouter:nex-agi/nex-n2.5-mini:free

stream: true
save: true
keybindings: emacs
highlight: true
wrap: auto
wrap_code: true
function_calling: false
save_session: null

clients:
  - type: openai-compatible
    name: openrouter
    api_base: https://openrouter.ai/api/v1

    # Nearly every free model is a reasoning model, and aichat renders the reasoning it
    # gets back inside <think> tags. This drops it at the source.
    patch:
      chat_completions:
        '.*':
          body:
            reasoning:
              exclude: true

    models:
      - name: nex-agi/nex-n2.5-mini:free
        max_input_tokens: 262144
        max_output_tokens: 235929
        input_price: 0
        output_price: 0
        supports_vision: true
        supports_function_calling: true

      - name: nvidia/nemotron-3-super-120b-a12b:free
        max_input_tokens: 262144
        max_output_tokens: 235929
        input_price: 0
        output_price: 0
        supports_function_calling: true


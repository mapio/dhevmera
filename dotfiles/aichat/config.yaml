# No api_key here: aichat falls back to OPENROUTER_API_KEY, which bash_secrets carries.
# Only ':free' ids are listed because a client's own list replaces the built-in one.

model: openrouter:nvidia/nemotron-3.5-lightning:free

stream: true
save: true
keybindings: emacs
highlight: true
wrap: auto
wrap_code: true
function_calling: false
save_session: null

clients:
  - type: openai-compatible
    name: openrouter
    api_base: https://openrouter.ai/api/v1
    models:
      - name: nvidia/nemotron-3.5-lightning:free
        max_input_tokens: 1000000
        max_output_tokens: 65536
        input_price: 0
        output_price: 0
        supports_function_calling: true

      - name: nvidia/nemotron-3-ultra-550b-a55b:free
        max_input_tokens: 1000000
        max_output_tokens: 65536
        input_price: 0
        output_price: 0
        supports_function_calling: true

      - name: thinkingmachines/inkling:free
        max_input_tokens: 1048576
        max_output_tokens: 262144
        input_price: 0
        output_price: 0
        supports_vision: true
        supports_function_calling: true

      - name: google/gemma-4-31b-it:free
        max_input_tokens: 262144
        max_output_tokens: 32768
        input_price: 0
        output_price: 0
        supports_vision: true
        supports_function_calling: true

      - name: z-ai/glm-5.2:free
        max_input_tokens: 32768
        max_output_tokens: 29491
        input_price: 0
        output_price: 0
